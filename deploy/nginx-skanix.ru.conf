# Кладётся на VPS в /etc/nginx/sites-available/skanix.ru, включается через
# sites-enabled. HTTP-only на старте — certbot --nginx сам допишет сюда
# HTTPS-блок и редирект после выпуска сертификата (см. DEPLOY.md).

server {
    listen 80;
    listen [::]:80;
    server_name skanix.ru;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
