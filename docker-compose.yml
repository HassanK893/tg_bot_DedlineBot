services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dedlinebot
      POSTGRES_PASSWORD: dedlinebot
      POSTGRES_DB: dedlinebot
    ports:
      # 5432 на этой машине уже занят нативным Postgres-сервисом Windows —
      # публикуем на 5433, чтобы не конфликтовать.
      - "5433:5432"
    volumes:
      - dedlinebot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dedlinebot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - dedlinebot_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dedlinebot_postgres_data:
  dedlinebot_redis_data:
