services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  # Одноразовый сервис: прогоняет миграции и завершается. Собирается из
  # «толстой» стадии build — только там есть Prisma CLI. Приложение стартует
  # лишь после того, как этот контейнер вышел с кодом 0.
  migrate:
    # Явное имя образа нужно, чтобы стек можно было поднять из заранее
    # собранного образа (`--no-build`), а не только собирая на месте.
    image: dedlinebot-migrate:latest
    build:
      context: ./app
      target: build
    restart: "no"
    command: npx prisma migrate deploy
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  app:
    image: dedlinebot-app:latest
    build:
      context: ./app
      target: runtime
    restart: unless-stopped
    env_file:
      - .env
    # Боту входящие соединения не нужны (long polling), порт нужен только чтобы
    # можно было руками проверить /healthz и REST API с самого сервера.
    # Префикс 127.0.0.1 — доступ только с localhost, из интернета порта нет.
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [internal]

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
    # IPv6 нужен, потому что на некоторых хостингах api.telegram.org и
    # registry.npmjs.org доступны ТОЛЬКО по IPv6, а докеровские сети по
    # умолчанию работают лишь по IPv4 — контейнер молча висит на таймауте.
    # Требует, чтобы у самого демона был включён IPv6 (см. DEPLOY.md).
    enable_ipv6: true
    driver_opts:
      # MTU 1400 вместо стандартных 1500. В IPv6 маршрутизаторы не дробят
      # пакеты сами — они шлют отправителю «уменьши размер», но через NAT эти
      # сообщения теряются. В итоге ping проходит, а крупные загрузки виснут
      # намертво. Запас в 100 байт снимает проблему.
      com.docker.network.driver.mtu: 1400
